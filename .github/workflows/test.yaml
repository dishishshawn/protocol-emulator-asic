# Modified to use uv and the protocol emulator regression.
name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r test/requirements.txt
      - name: Run tests
        run: PATH="$PWD/.venv/bin:$PATH" DEMO_REPORT="$PWD/test/fault-demo.json" make -C test
      - name: Test summary
        uses: test-summary/action@v2.4
        with:
          paths: test/results.xml
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulation-results
          path: |
            test/results.xml
            test/fault-demo.json
            test/tb.fst
