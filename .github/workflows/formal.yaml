# Formal proofs and negative controls off the development machine: the same
# tools/formal.sh as `just formal`, with sby/Yosys/Yices from a pinned OSS CAD
# Suite build (each log records the versions).
name: formal
on:
  push:
    paths:
      - src/engine.v
      - formal/**
      - tools/formal.sh
      - tools/check_formal_mutations.py
      - tools/formal_report.py
      - .github/workflows/formal.yaml
  workflow_dispatch:

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-09-23'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: bmc, prove, cover
        run: tools/formal.sh
      - name: Negative controls (each mutated engine must fail bmc)
        run: python3 tools/check_formal_mutations.py
      - name: Summarize
        run: python3 tools/formal_report.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formal-results
          path: |
            reports/formal.json
            build/formal/*.log
            build/formal-mutations/results.json
            build/formal-mutations/*/out/bmc.log
