# Modified for the protocol emulator competition prototype.
# Tiny Tapeout project information
project:
  title:        "Programmable protocol emulator"      # Project title
  author:       "dishishshawn"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Cycle-timed programmable five-lane protocol engine"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # Competition allocation; verify support in current hardening flow

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_dishishshawn_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "engine.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_DATA[0]"
  ui[1]: "HOST_DATA[1]"
  ui[2]: "HOST_DATA[2]"
  ui[3]: "HOST_DATA[3]"
  ui[4]: "HOST_DATA[4]"
  ui[5]: "HOST_DATA[5]"
  ui[6]: "HOST_DATA[6]"
  ui[7]: "HOST_DATA[7]"

  # Outputs
  uo[0]: "SAMPLE[0]"
  uo[1]: "SAMPLE[1]"
  uo[2]: "SAMPLE[2]"
  uo[3]: "SAMPLE[3]"
  uo[4]: "SAMPLE[4]"
  uo[5]: "HALTED"
  uo[6]: "RUNNING"
  uo[7]: "FAULT"

  # Bidirectional pins
  uio[0]: "LANE[0]"
  uio[1]: "LANE[1]"
  uio[2]: "LANE[2]"
  uio[3]: "LANE[3]"
  uio[4]: "LANE[4]"
  uio[5]: "REWIND_RX_PAGE"
  uio[6]: "RUN"
  uio[7]: "LOAD"

# Do not change!
yaml_version: 6
